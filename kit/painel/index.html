<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="token" content="{{TOKEN}}">
<title>{{NOME}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="/fontes/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fontes/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/estilo.css">
<script src="/tema.js"></script>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>{{NOME}}</b><small>Prospecção local com IA</small></div>
    <nav class="tabs" aria-label="Seções">
      <div role="tablist" id="abas">
        <button class="tab" role="tab" id="aba-buscar" data-aba="buscar" aria-controls="conteudo" aria-selected="false" tabindex="-1">Buscar</button>
        <button class="tab" role="tab" id="aba-leads" data-aba="leads" aria-controls="conteudo" aria-selected="false" tabindex="-1">Leads <span class="count" id="aba-leads-contagem" hidden></span></button>
        <button class="tab" role="tab" id="aba-oferta" data-aba="oferta" aria-controls="conteudo" aria-selected="false" tabindex="-1">Minha oferta</button>
      </div>
    </nav>
    <div class="rail-rodape top-acoes">
      <div class="engine" id="motor" data-estado="verificando" role="status" title="O buscador roda só no seu computador">
        <span class="dot" aria-hidden="true"></span><span id="motor-texto">Verificando o buscador</span>
      </div>
      <button class="icon-btn" id="tema" type="button" aria-label="Trocar entre tema claro e escuro" title="Tema claro ou escuro"><span aria-hidden="true">&#9680;</span><span class="txt">Tema claro ou escuro</span></button>
    </div>
  </aside>

  <div class="coluna">
    <div id="avisos"></div>
    <main id="conteudo" tabindex="-1">
      <div class="wrap" id="tela" role="tabpanel">
        <noscript><div class="card sem-js">O painel precisa de JavaScript ligado no navegador para funcionar.</div></noscript>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
